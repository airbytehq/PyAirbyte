# Agent-facing messages for Airbyte Cloud problem types.
# Keys are normalized problem types (see `_problem_key` in cloud_errors.py).
auth/sso-required:
  guidance: Ask the user to sign in through SSO.
  message: This email domain must sign in with SSO.
auth/user-already-exists:
  guidance: Use the existing one or pick another name; don't retry as is.
  message: A resource with this name or membership already exists.
bad-request:
