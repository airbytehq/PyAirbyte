status_fallbacks:
  401:
    message: Airbyte Cloud rejected the credentials.
    guidance: Ask the user to check the client ID/secret or token; don't retry.
  404:
    message: The resource was not found.
    guidance: Check the ID; list the resources to find the right one.
  408:
    message: Airbyte Cloud timed out. The change may or may not have been applied.
    guidance: Check the resource's current state before retrying; don't blindly retry a create.
  409:
    message: The resource is in a state that doesn't allow this operation (for example, a job is running or already finished).
    guidance: Check the resource's current status before retrying.
  429:
    message: Airbyte Cloud is refusing requests from these credentials (rate limited).
    guidance: Stop calling Airbyte Cloud tools and tell the user; don't retry.
  4xx:
    message: Airbyte Cloud rejected the request as invalid.
    guidance: Check the arguments against the tool description.
  5xx:
    message: Airbyte Cloud hit an unexpected error. This is often caused by an invalid argument value.
    guidance: Check the arguments (ranges, IDs, formats). If they look right, don't retry more than once; tell the user.
  default:
    message: Airbyte Cloud returned an error.
    guidance: Retry at most once; tell the user if it persists.
