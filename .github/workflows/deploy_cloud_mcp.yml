# Deploys the cloud-mcp Cloud Run services, which run the PyAirbyte MCP server.
#
# The services themselves live in other repos, so this workflow only resolves
# which PyAirbyte build should ship and hands it off via `repository_dispatch`:
# - airbytehq/airbyte-ops-mcp - owns cloud-mcp-preview and cloud-mcp under
#   mcp.internal.airbyte.ai.
# - airbytehq/airbyte-platform-internal - owns the production service behind
#   mcp.airbyte.com/mcp.
#
# Every trigger is normalized to a `trigger-type`, and the env routing table below
# decides which services that trigger type deploys to. Pushes install the triggering
# commit from git (no PyPI release needed); `pypi_publish.yml` calls this after
# a publish to ship the published version.

name: Deploy Cloud MCP

on:
  push:
    branches:
      - main
      - 'release-candidate/**'
  workflow_call:
    inputs:
      pyairbyte-version:
        description: 'Published PyAirbyte version to pin (e.g. "0.56.0").'
        required: true
        type: string
      trigger-type:
        description: 'Trigger type for routing: "rc-release", "stable-release", or "pr-prerelease".'
        required: true
        type: string
    secrets:
      OCTAVIA_BOT_APP_ID:
        description: 'GitHub App ID used to dispatch the airbyte-ops-mcp deploy workflow.'
        required: true
      OCTAVIA_BOT_PRIVATE_KEY:
        description: 'Private key for the GitHub App above.'
        required: true

permissions:
  contents: read

env:
  # Each deployment is sourced by the trigger types listed under it. A
  # trigger type is one of:
  #   main-push        push to `main`
  #   rc-push          push to `release-candidate/**`
  #   rc-release       published GitHub release tagged `-rc.`
  #   stable-release   any other published release
  #   pr-prerelease    `/prerelease` dev build via pypi_publish.yml
  # mcp.internal.airbyte.ai/cloud-mcp-preview (airbyte-ops-mcp)
  INTERNAL_MCP_PREVIEW_SOURCES: >
    rc-push
    rc-release
    pr-prerelease
  # mcp.internal.airbyte.ai/cloud-mcp (airbyte-ops-mcp)
  INTERNAL_MCP_SOURCES: >
    rc-release
  # mcp.airbyte.com/mcp (airbyte-platform-internal)
  # TODO: replace `rc-release` with `stable-release` after the 1.0 merge.
  PROD_MCP_SOURCES: >
    rc-release

# Serialize the dispatch requests per trigger type (per branch for pushes).
# Pushes and `/prerelease` dev builds only ever want the newest, so supersede
# in-flight runs; releases run to completion.
concurrency:
  group: deploy-cloud-mcp-${{ inputs.trigger-type || github.ref_name }}
  cancel-in-progress: ${{ inputs.trigger-type == '' || inputs.trigger-type == 'pr-prerelease' }}

jobs:
  resolve-vars:
    name: Resolve Variables
    runs-on: ubuntu-latest
    outputs:
      trigger_type: ${{ steps.resolve-vars.outputs.trigger_type }}
      requirement: ${{ steps.resolve-vars.outputs.requirement }}
      pinned: ${{ steps.resolve-vars.outputs.pinned }}
      deploy_internal_preview: ${{ steps.resolve-vars.outputs.deploy_internal_preview }}
      deploy_internal: ${{ steps.resolve-vars.outputs.deploy_internal }}
      deploy_prod: ${{ steps.resolve-vars.outputs.deploy_prod }}
    steps:
      - name: Resolve Variables
        id: resolve-vars
        env:
          PYAIRBYTE_VERSION: ${{ inputs.pyairbyte-version || '' }}
          # `trigger-type` is a required `workflow_call` input, so a non-empty value
          # means a caller invoked this workflow. On the `push` trigger the
          # `inputs` context is empty, which is what selects the git install
          # below. This does not use `github.event_name`, which in a reusable
          # workflow reports the *caller's* trigger.
          TRIGGER_TYPE: ${{ inputs.trigger-type || '' }}
        run: |
          set -euo pipefail
          version="${PYAIRBYTE_VERSION#v}"

          # ---------- Which trigger type started this run ----------
          trigger_type="$TRIGGER_TYPE"
          if [ -z "$trigger_type" ]; then
            case "$GITHUB_REF_NAME" in
              main) trigger_type=main-push ;;
              release-candidate/*) trigger_type=rc-push ;;
              *)
                echo "::error::Unexpected push ref: $GITHUB_REF_NAME"
                exit 1
                ;;
            esac
          fi
          printf '%s\n' main-push rc-push rc-release stable-release pr-prerelease | grep -qxF "$trigger_type" \
            || { echo "::error::Invalid trigger-type: '$trigger_type' (allowed: main-push, rc-push, rc-release, stable-release, pr-prerelease)"; exit 1; }
          # A caller shipping a publish must name the published version, or
          # this would silently deploy the ref instead of the release.
          case "$trigger_type" in
            main-push|rc-push) ;;
            *)
              [ -n "$version" ] \
                || { echo "::error::pyairbyte-version is required when this workflow is called."; exit 1; }
              ;;
          esac
          if [ -n "$version" ]; then
            case "$version" in
              [!0-9]*|*[!0-9A-Za-z.+!-]*)
                echo "::error::Invalid PEP 440 version: $version"
                exit 1
                ;;
            esac
          fi

          # ---------- Requirement to install into the image ----------
          # A published version is pinned exactly; otherwise install the
          # triggering commit from git, so a branch push needs no release.
          if [ -n "$version" ]; then
            requirement="airbyte==$version"
            pinned="true"
          else
            requirement="airbyte @ git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            pinned="false"
          fi

          # ---------- Route the trigger type to services (see the env table) ----------
          # shellcheck disable=SC2086
          routes_to() { if printf '%s\n' $2 | grep -qxF "$1"; then echo true; else echo false; fi; }
          deploy_internal_preview="$(routes_to "$trigger_type" "$INTERNAL_MCP_PREVIEW_SOURCES")"
          deploy_internal="$(routes_to "$trigger_type" "$INTERNAL_MCP_SOURCES")"
          deploy_prod="$(routes_to "$trigger_type" "$PROD_MCP_SOURCES")"
          any_target=false
          if [ "$deploy_internal_preview" = "true" ] || [ "$deploy_internal" = "true" ] || [ "$deploy_prod" = "true" ]; then
            any_target=true
          else
            echo "::notice::No deploy target routes trigger type '$trigger_type'; nothing to dispatch."
          fi

          {
            printf 'trigger_type=%s\n' "$trigger_type"
            printf 'requirement=%s\n' "$requirement"
            printf 'pinned=%s\n' "$pinned"
            printf 'deploy_internal_preview=%s\n' "$deploy_internal_preview"
            printf 'deploy_internal=%s\n' "$deploy_internal"
            printf 'deploy_prod=%s\n' "$deploy_prod"
            printf 'any_target=%s\n' "$any_target"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.resolve-vars.outputs.pinned == 'true' && steps.resolve-vars.outputs.any_target == 'true'
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
        with:
          enable-cache: false

      # Gate on `uv` itself: it reads the PEP 691 JSON variant of the simple
      # index, which PyPI caches separately (`vary: Accept`) from the HTML one
      # and which can stay stale for far longer. Polling anything else can go
      # green while the cloud-mcp image build still cannot resolve the version.
      - name: Wait for PyAirbyte version to be resolvable
        if: steps.resolve-vars.outputs.pinned == 'true' && steps.resolve-vars.outputs.any_target == 'true'
        env:
          PYPI_REQUIREMENT: ${{ steps.resolve-vars.outputs.requirement }}
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if uv pip compile --quiet --no-cache --no-deps --python-version 3.12 \
              --output-file "$RUNNER_TEMP/pyairbyte-requirement.txt" - \
              <<<"$PYPI_REQUIREMENT"; then
              break
            fi
            echo "$PYPI_REQUIREMENT is not resolvable from PyPI yet (attempt $attempt/30)."
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
            attempt=$((attempt + 1))
          done
          [ "$attempt" -le 30 ] \
            || { echo "::error::$PYPI_REQUIREMENT did not become resolvable from PyPI after 30 attempts."; exit 1; }

  deploy-internal:
    name: Deploy to Internal Endpoints
    needs: resolve-vars
    if: needs.resolve-vars.outputs.deploy_internal_preview == 'true' || needs.resolve-vars.outputs.deploy_internal == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build cloud-mcp dispatch payloads
        id: build-dispatch-payload
        env:
          PYAIRBYTE_REQUIREMENT: ${{ needs.resolve-vars.outputs.requirement }}
        run: |
          set -euo pipefail
          preview_payload="$(jq -cn \
            --arg requirement "$PYAIRBYTE_REQUIREMENT" \
            '{"mcp-server": "cloud-mcp", "preview": "true", "cloud-mcp-pyairbyte-requirement": $requirement}')"
          prod_payload="$(jq -cn \
            --arg requirement "$PYAIRBYTE_REQUIREMENT" \
            '{"mcp-server": "cloud-mcp", "preview": "false", "cloud-mcp-pyairbyte-requirement": $requirement}')"
          {
            printf 'preview_payload=%s\n' "$preview_payload"
            printf 'prod_payload=%s\n' "$prod_payload"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate as GitHub App
        id: get-app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          owner: airbytehq
          repositories: airbyte-ops-mcp
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
          # `repository_dispatch` needs contents:write and nothing else.
          permission-contents: write

      - name: Trigger internal cloud-mcp-preview deploy
        if: needs.resolve-vars.outputs.deploy_internal_preview == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.get-app-token.outputs.token }}
          repository: airbytehq/airbyte-ops-mcp
          event-type: deploy-cloud-mcp
          client-payload: ${{ steps.build-dispatch-payload.outputs.preview_payload }}

      # Runs even if the preview dispatch above failed; the two services are
      # routed independently.
      - name: Trigger internal cloud-mcp deploy
        if: >-
          !cancelled()
          && steps.get-app-token.outcome == 'success'
          && needs.resolve-vars.outputs.deploy_internal == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.get-app-token.outputs.token }}
          repository: airbytehq/airbyte-ops-mcp
          event-type: deploy-cloud-mcp
          client-payload: ${{ steps.build-dispatch-payload.outputs.prod_payload }}

  # ---------- Second target: airbyte-platform-internal ----------
  # Its `Deploy Cloud MCP` workflow builds the image from a vendored copy
  # of the cloud-mcp build context and rolls out the Cloud Run service it
  # owns. Gated on the production path: that repo has only a production
  # service, so a preview deploy has nothing to target there.
  deploy-prod:
    name: Deploy to Prod Endpoints
    needs: resolve-vars
    if: needs.resolve-vars.outputs.deploy_prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build platform-internal dispatch payload
        id: build-dispatch-payload
        env:
          PYAIRBYTE_REQUIREMENT: ${{ needs.resolve-vars.outputs.requirement }}
          PINNED: ${{ needs.resolve-vars.outputs.pinned }}
        run: |
          set -euo pipefail

          # Every PROD_MCP_SOURCES entry is a release trigger type, so the
          # requirement is always the pinned `airbyte==<version>` form; guard
          # anyway so a future push trigger type can't ship a git ref silently.
          [ "$PINNED" = "true" ] \
            || { echo "::error::production deploys require a pinned airbyte==<version> requirement."; exit 1; }
          version="${PYAIRBYTE_REQUIREMENT#airbyte==}"

          # The target defaults `image_tag` to `manual-<its own short sha>`,
          # which names nothing about the PyAirbyte build and repeats across
          # releases whenever that repo's HEAD has not moved. Name the tag after
          # the version instead. PEP 440 allows `+` and `!`, which are not legal
          # in a Docker tag and which the target rejects outright, so map every
          # disallowed character to `-`.
          image_tag="pyairbyte-$(printf '%s' "$version" | sed 's/[^a-zA-Z0-9._-]/-/g')"

          # `deploy` is a string because `client_payload` is untyped JSON; the
          # target validates it against exactly `true`/`false`.
          payload="$(jq -cn \
            --arg requirement "$PYAIRBYTE_REQUIREMENT" \
            --arg image_tag "$image_tag" \
            '{"pyairbyte_requirement": $requirement, "image_tag": $image_tag, "deploy": "true"}')"

          {
            printf 'payload=%s\n' "$payload"
            printf 'image_tag=%s\n' "$image_tag"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Authenticate as GitHub App for platform-internal
        id: get-internal-app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          owner: airbytehq
          repositories: airbyte-platform-internal
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
          # `repository_dispatch` needs contents:write and nothing else.
          permission-contents: write

      - name: Trigger platform-internal cloud-mcp deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.get-internal-app-token.outputs.token }}
          repository: airbytehq/airbyte-platform-internal
          event-type: deploy-cloud-mcp
          client-payload: ${{ steps.build-dispatch-payload.outputs.payload }}

  summarize:
    name: Summarize
    needs: [resolve-vars, deploy-internal, deploy-prod]
    if: always() && needs.resolve-vars.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize dispatch
        env:
          TRIGGER_TYPE: ${{ needs.resolve-vars.outputs.trigger_type }}
          PYAIRBYTE_REQUIREMENT: ${{ needs.resolve-vars.outputs.requirement }}
          DEPLOY_INTERNAL_PREVIEW: ${{ needs.resolve-vars.outputs.deploy_internal_preview }}
          DEPLOY_INTERNAL: ${{ needs.resolve-vars.outputs.deploy_internal }}
          DEPLOY_PROD: ${{ needs.resolve-vars.outputs.deploy_prod }}
          INTERNAL_RESULT: ${{ needs.deploy-internal.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}
          INTERNAL_RUNS_URL: https://github.com/airbytehq/airbyte-ops-mcp/actions/workflows/deploy-mcp-command.yml?query=event%3Arepository_dispatch
          PROD_RUNS_URL: https://github.com/airbytehq/airbyte-platform-internal/actions/workflows/deploy-cloud-mcp.yml?query=event%3Arepository_dispatch
        run: |
          # print_route <label> <routed> <job result> <target workflow runs url>
          print_route() {
            if [ "$2" != "true" ]; then
              printf -- '- %s: Skipped (not routed)\n' "$1"
              return
            fi
            case "$3" in
              success)   printf -- '- %s: [Dispatched](%s)\n' "$1" "$4" ;;
              failure)   printf -- '- %s: Failed\n' "$1" ;;
              cancelled) printf -- '- %s: Cancelled\n' "$1" ;;
              *)         printf -- '- %s: %s\n' "$1" "$3" ;;
            esac
          }
          {
            printf -- '- Trigger type: %s\n' "$TRIGGER_TYPE"
            printf -- '- Requirement: %s\n' "$PYAIRBYTE_REQUIREMENT"
            print_route "airbyte-ops-mcp cloud-mcp-preview" "$DEPLOY_INTERNAL_PREVIEW" "$INTERNAL_RESULT" "$INTERNAL_RUNS_URL"
            print_route "airbyte-ops-mcp cloud-mcp" "$DEPLOY_INTERNAL" "$INTERNAL_RESULT" "$INTERNAL_RUNS_URL"
            print_route "airbyte-platform-internal cloud-mcp" "$DEPLOY_PROD" "$PROD_RESULT" "$PROD_RUNS_URL"
          } | tee -a "$GITHUB_STEP_SUMMARY"
