# This workflow publishes the python package to PyPI.
#
# Triggers:
# - release: published - When user clicks "Publish" on a draft release (downloads pre-built assets)
# - workflow_dispatch - On-demand prerelease builds from a PR branch
#
# Authentication: This workflow expects GitHub OIDC for passwordless PyPI publishing.
# For more info: https://docs.pypi.org/trusted-publishers/

name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build from (e.g., refs/pull/123/head)'
        type: string
        required: true
      version_override:
        description: 'Version string to publish (overrides dynamic versioning)'
        type: string
        required: true
      publish:
        description: 'Whether to publish to PyPI'
        type: string
        required: false
        default: 'true'

env:
  AIRBYTE_ANALYTICS_ID: ${{ vars.AIRBYTE_ANALYTICS_ID }}

jobs:
  publish_to_pypi:
    name: Publish Package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: PyPi
      url: https://pypi.org/p/airbyte
    steps:
      # For release events: download pre-built assets
      - name: Download release assets
        if: github.event_name == 'release'
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: dist

      # For workflow_dispatch (prereleases): checkout, override version, and build
      - name: Checkout code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.event.inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
        with:
          enable-cache: false

      - name: Build package with version override
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Override dynamic versioning with the prerelease version
          export UV_DYNAMIC_VERSIONING_BYPASS="$VERSION_OVERRIDE"
          uv build
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}

      # Uses GitHub OIDC for passwordless authentication (see header comment)
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: pypa/gh-action-pypi-publish@v1.13.0

  # Prod cloud-mcp is bumped via Dependabot on airbytehq/airbyte-ops-mcp, not here.
  # A PyPI publish dispatches the just-released version to airbyte-ops-mcp, which
  # opens/refreshes a deterministic `airbyte==<version>` bump PR and deploys the
  # cloud-mcp preview off it (see `deploy-mcp-command.yml`).
  deploy_cloud_mcp_preview:
    name: Deploy Cloud MCP (Preview)
    needs: publish_to_pypi
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Resolve released version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            raw="${{ github.event.release.tag_name }}"
          else
            raw="${{ github.event.inputs.version_override }}"
          fi
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI availability
        run: sleep 120

      # Cross-repo dispatch is authenticated with an Octavia GitHub App token
      # scoped to airbyte-ops-mcp (the app must be installed there with
      # contents: write), matching the pattern used by prerelease-command.yml.
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        id: get-app-token
        with:
          owner: airbytehq
          repositories: airbyte-ops-mcp
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Trigger cloud-mcp preview deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.get-app-token.outputs.token }}
          repository: airbytehq/airbyte-ops-mcp
          event-type: deploy-cloud-mcp
          client-payload: '{"mcp-server": "cloud-mcp", "preview": "true", "airbyte-version": "${{ steps.version.outputs.value }}"}'
