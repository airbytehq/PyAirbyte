# This workflow publishes the python package to PyPI.
#
# Triggers:
# - release: published - When user clicks "Publish" on a draft release (downloads pre-built assets)
# - workflow_dispatch - On-demand prerelease builds from a PR branch
#
# Authentication: This workflow expects GitHub OIDC for passwordless PyPI publishing.
# For more info: https://docs.pypi.org/trusted-publishers/

name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build from (e.g., refs/pull/123/head)'
        type: string
        required: true
      version_override:
        description: 'Version string to publish (overrides dynamic versioning)'
        type: string
        required: true
      publish:
        description: 'Whether to publish to PyPI'
        type: string
        required: false
        default: 'true'

env:
  AIRBYTE_ANALYTICS_ID: ${{ vars.AIRBYTE_ANALYTICS_ID }}

jobs:
  publish_to_pypi:
    name: Publish Package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: PyPi
      url: https://pypi.org/p/airbyte
    steps:
      # For release events: download pre-built assets
      - name: Download release assets
        if: github.event_name == 'release'
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: dist

      # For workflow_dispatch (prereleases): checkout, override version, and build
      - name: Checkout code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.event.inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
        with:
          enable-cache: false

      - name: Build package with version override
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Override dynamic versioning with the prerelease version
          export UV_DYNAMIC_VERSIONING_BYPASS="$VERSION_OVERRIDE"
          uv build
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}

      # Uses GitHub OIDC for passwordless authentication (see header comment)
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: pypa/gh-action-pypi-publish@v1.13.0

  # Prod cloud-mcp is bumped via Dependabot on airbytehq/airbyte-ops-mcp, not here.
  # A PyPI publish refreshes the cloud-mcp preview with the exact published
  # PyAirbyte requirement.
  deploy_cloud_mcp_preview:
    name: Deploy Cloud MCP (Preview)
    needs: publish_to_pypi
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Resolve published PyAirbyte requirement
        id: resolve-pyairbyte-requirement
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override || '' }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version="${version:-${VERSION_OVERRIDE#v}}"
          [ -n "$version" ] || { echo "::error::Could not resolve the published PyAirbyte version."; exit 1; }
          case "$version" in
            ''|[!0-9]*|*[!0-9A-Za-z.+!-]*)
              echo "::error::Invalid PEP 440 version: $version"
              exit 1
              ;;
          esac
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "requirement=airbyte==$version" | tee -a "$GITHUB_OUTPUT"

      - name: Wait for PyAirbyte version on PyPI
        env:
          PYPI_VERSION: ${{ steps.resolve-pyairbyte-requirement.outputs.version }}
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le 30 ] && ! curl --fail --silent --show-error \
            --output /dev/null "https://pypi.org/pypi/airbyte/$PYPI_VERSION/json"; do
            echo "PyPI version $PYPI_VERSION is not available yet (attempt $attempt/30)."
            sleep 10
            attempt=$((attempt + 1))
          done
          [ "$attempt" -le 30 ] \
            || { echo "::error::PyPI version $PYPI_VERSION did not become available after 30 attempts."; exit 1; }

      - name: Build cloud-mcp dispatch payload
        id: build-client-payload
        env:
          PYPI_REQUIREMENT: ${{ steps.resolve-pyairbyte-requirement.outputs.requirement }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg requirement "$PYPI_REQUIREMENT" \
            '{"mcp-server": "cloud-mcp", "preview": "true", "cloud-mcp-pyairbyte-requirement": $requirement}')"
          echo "payload=$payload" | tee -a "$GITHUB_OUTPUT"

      - name: Trigger cloud-mcp preview deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.GITHUB_CI_WORKFLOW_TRIGGER_PAT }}
          repository: airbytehq/airbyte-ops-mcp
          event-type: deploy-cloud-mcp
          client-payload: ${{ steps.build-client-payload.outputs.payload }}
