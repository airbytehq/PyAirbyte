# This workflow publishes the python package to PyPI.
#
# Triggers:
# - release: published - When user clicks "Publish" on a draft release (downloads pre-built assets)
# - workflow_dispatch - On-demand prerelease builds from a PR branch
#
# Authentication: This workflow expects GitHub OIDC for passwordless PyPI publishing.
# For more info: https://docs.pypi.org/trusted-publishers/

name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to build from (e.g., refs/pull/123/head)'
        type: string
        required: true
      version_override:
        description: 'Version string to publish (overrides dynamic versioning)'
        type: string
        required: true
      publish:
        description: 'Whether to publish to PyPI'
        type: string
        required: false
        default: 'true'

env:
  AIRBYTE_ANALYTICS_ID: ${{ vars.AIRBYTE_ANALYTICS_ID }}

jobs:
  publish_to_pypi:
    name: Publish Package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: PyPi
      url: https://pypi.org/p/airbyte
    steps:
      # For release events: download pre-built assets
      - name: Download release assets
        if: github.event_name == 'release'
        uses: robinraju/release-downloader@v1.12
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: dist

      # For workflow_dispatch (prereleases): checkout, override version, and build
      - name: Checkout code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.event.inputs.git_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@f06b870e0a91d23284a3013acc55e6f88ab4b904 # v7
        with:
          enable-cache: false

      - name: Build package with version override
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Override dynamic versioning with the prerelease version
          export UV_DYNAMIC_VERSIONING_BYPASS="$VERSION_OVERRIDE"
          uv build
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}

      # Uses GitHub OIDC for passwordless authentication (see header comment)
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # A publish ships the exact published version to cloud-mcp. Every publish
  # refreshes the preview service, so preview always reports the newest
  # published version rather than a post-release git build of the prior one.
  deploy_cloud_mcp_preview:
    name: Deploy Cloud MCP Preview
    needs: publish_to_pypi
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/deploy_cloud_mcp.yml
    secrets:
      OCTAVIA_BOT_APP_ID: ${{ secrets.OCTAVIA_BOT_APP_ID }}
      OCTAVIA_BOT_PRIVATE_KEY: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
    with:
      pyairbyte-version: ${{ github.event.release.tag_name || github.event.inputs.version_override }}
      preview: ${{ 'true' }}

  # A public (non-prerelease) release additionally promotes the version to
  # production.
  deploy_cloud_mcp:
    name: Deploy Cloud MCP
    needs: publish_to_pypi
    if: github.event_name == 'release' && github.event.release.prerelease != true
    # The dispatch to airbyte-ops-mcp is authenticated with a GitHub App token,
    # not `GITHUB_TOKEN`, so this job needs nothing beyond reading the workflow.
    permissions:
      contents: read
    uses: ./.github/workflows/deploy_cloud_mcp.yml
    secrets:
      OCTAVIA_BOT_APP_ID: ${{ secrets.OCTAVIA_BOT_APP_ID }}
      OCTAVIA_BOT_PRIVATE_KEY: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
    with:
      pyairbyte-version: ${{ github.event.release.tag_name }}
      preview: ${{ 'false' }}
