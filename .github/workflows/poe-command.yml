name: On-Demand Poe Task

on:
  workflow_dispatch:
    inputs:
      comment-id:
        description: "Optional comment-id of the slash command. Ignore if not applicable."
        required: false
      pr:
        description: "PR Number"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run-poe-command:
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the pr and comment-id inputs are numbers
        env:
          EVENT_INPUTS_PR: ${{ github.event.inputs.pr }}
          EVENT_INPUTS_COMMENT_ID: ${{ github.event.inputs.comment-id }}
        run: |
          if [[ ! "${EVENT_INPUTS_PR}" =~ ^[0-9]*$ || ! "${EVENT_INPUTS_COMMENT_ID}" =~ ^[0-9]*$ ]]; then
            echo "::error::The pr and comment-id inputs must be numbers."
            exit 1
          fi
      - name: Authenticate as GitHub App
        uses: actions/create-github-app-token@v2
        id: get-app-token
        with:
          owner: "airbytehq"
          repositories: "PyAirbyte"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Run Poe Slash Command Processor
        uses: airbytehq/poe-command-processor@1f86febb59b1e3fe79c49fb3d13b4784fad2354e # main
        with:
          pr: ${{ github.event.inputs.pr }}
          comment-id: ${{ github.event.inputs.comment-id }}
          github-token: ${{ steps.get-app-token.outputs.token }}
