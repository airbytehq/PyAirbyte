name: On-Demand Cloud MCP Evals

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR Number'
        type: string
        required: true
      comment-id:
        description: 'Comment ID (Optional)'
        type: string
        required: false
      full:
        description: 'Run the full suite instead of only scenarios using changed MCP tools'
        type: string
        required: false
        default: 'false'
      compare:
        description: "Also run the PR's base and post the comparison"
        type: string
        required: false
        default: 'false'

env:
  AIRBYTE_ANALYTICS_ID: ${{ vars.AIRBYTE_ANALYTICS_ID }}

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: evals-command-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  run-evals:
    name: Run Cloud MCP Evals
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PR: ${{ inputs.pr }}
      FULL: ${{ inputs.full }}
      COMPARE: ${{ inputs.compare }}
      EVALS_REPO: airbytehq/cloud-mcp-evals
    steps:
    - name: Resolve workflow variables
      id: vars
      uses: aaronsteers/resolve-ci-vars-action@2e56afab0344bbe03c047dfa39bae559d0291472 # v0.1.6

    - name: Resolve eval mode
      id: mode
      env:
        SHA: ${{ steps.vars.outputs.pr-source-git-sha }}
      run: |
        set -euo pipefail
        [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number: $PR"; exit 1; }
        [[ "$COMPARE" == "true" || "$COMPARE" == "false" ]] \
          || { echo "::error::Invalid compare value: $COMPARE"; exit 1; }
        if [ "$FULL" = "true" ]; then
          changed_only=false
          label="full suite"
        else
          changed_only=true
          label="changed tools only"
        fi
        if [ "$COMPARE" = "true" ]; then
          label="$label, compared with base"
        fi
        {
          echo "changed-only=$changed_only"
          echo "label=$label"
          echo "compare=$COMPARE"
          echo "short-sha=${SHA:0:7}"
        } >> "$GITHUB_OUTPUT"

    - name: Read run arguments
      id: args
      if: inputs.comment-id != ''
      env:
        COMMENT_ID: ${{ inputs.comment-id }}
        GH_TOKEN: ${{ github.token }}
        BASE_LABEL: ${{ steps.mode.outputs.label }}
      run: |
        set -euo pipefail
        COMMENT_BODY="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)"
        export COMMENT_BODY
        RUN_ARGS="$(python3 - <<'PY'
        import os
        import re

        first_line = os.environ["COMMENT_BODY"].split("\n", 1)[0].rstrip("\r")
        first_line = re.sub(r"^\s*/evals(?:\s+|$)", "", first_line, count=1)
        first_line = re.sub(r"(?<!\S)(?:full|ref|compare)=[^\s]+", "", first_line)
        print(first_line.strip())
        PY
        )"
        delimiter="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
        {
          printf 'run-args<<%s\n' "$delimiter"
          printf '%s\n' "$RUN_ARGS"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"
        label="$BASE_LABEL"
        [[ -n "$RUN_ARGS" ]] && printf -v label "%s, \`%s\`" "$BASE_LABEL" "$RUN_ARGS"
        printf 'label=%s\n' "$label" | tee -a "$GITHUB_OUTPUT"

    - name: Append comment with job run link
      id: first-comment-action
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ inputs.comment-id }}
        issue-number: ${{ inputs.pr }}
        body: |

          > Cloud MCP evals queued for `${{ steps.mode.outputs.short-sha }}` (${{ steps.args.outputs.label || steps.mode.outputs.label }}). [Check job output.](${{ steps.vars.outputs.run-url }})

    # The token lasts one hour; a full evals run takes about 20 minutes.
    - name: Authenticate as GitHub App
      uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      id: get-app-token
      with:
        owner: "airbytehq"
        repositories: "cloud-mcp-evals"
        app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
        private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}
        permission-actions: write

    - name: Dispatch evals and find the run
      id: dispatch
      env:
        GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
        CHANGED_ONLY: ${{ steps.mode.outputs.changed-only }}
        RUN_ARGS: ${{ steps.args.outputs.run-args }}
        COMPARE: ${{ steps.mode.outputs.compare }}
      run: |
        set -euo pipefail
        since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        extra=()
        [[ -n "$RUN_ARGS" ]] && extra=(-f run_args="$RUN_ARGS")
        compare_args=()
        if [ "$COMPARE" = "true" ]; then
          compare_args+=(-f compare=true)
        fi
        gh workflow run evals.yml -R "$EVALS_REPO" --ref main \
          -f pyairbyte="#$PR" -f changed_tools_only="$CHANGED_ONLY" \
          "${extra[@]}" "${compare_args[@]}"
        title="PyAirbyte evals: #$PR"
        for _ in $(seq 18); do
          sleep 10
          run=$(gh run list -R "$EVALS_REPO" -w evals.yml --event workflow_dispatch --limit 20 \
            --json databaseId,createdAt,displayTitle,url |
            jq -c --arg since "$since" --arg title "$title" '[.[] | select(.createdAt >= $since
              and (.displayTitle == $title or (.displayTitle | startswith($title + " "))))] | last')
          if [ "$run" != "null" ]; then
            echo "run-id=$(jq -r .databaseId <<< "$run")" >> "$GITHUB_OUTPUT"
            echo "run-url=$(jq -r .url <<< "$run")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::No '$title' run created after $since appeared in $EVALS_REPO within 3 minutes."
        exit 1

    - name: Append comment with evals run link
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.first-comment-action.outputs.comment-id }}
        body: |
          > Evals running: [${{ steps.dispatch.outputs.run-url }}](${{ steps.dispatch.outputs.run-url }})

    - name: Wait for evals and summarize
      id: report
      env:
        GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
        RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        RUN_URL: ${{ steps.dispatch.outputs.run-url }}
        LABEL: ${{ steps.args.outputs.label || steps.mode.outputs.label }}
        CHANGED_ONLY: ${{ steps.mode.outputs.changed-only }}
        COMPARE: ${{ steps.mode.outputs.compare }}
      run: |
        set -euo pipefail
        # Eval failures are expected (model variance); they are reported, not fatal.
        gh run watch "$RUN_ID" -R "$EVALS_REPO" --interval 30 > /dev/null
        conclusion=$(gh run view "$RUN_ID" -R "$EVALS_REPO" --json conclusion --jq .conclusion)
        # A changed-tools run with nothing to run uploads no evidence; any other
        # listing or download failure fails the job.
        artifacts=$(gh api "repos/$EVALS_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
          --jq '.artifacts[] | select(.name | startswith("all-evidence-")) | .name')
        results=""
        if [ -n "$artifacts" ]; then
          dir=$(mktemp -d)
          gh run download "$RUN_ID" -R "$EVALS_REPO" -p 'all-evidence-*' -D "$dir"
          results=$(find "$dir" -name results.json | head -n 1)
          [ -n "$results" ] || { echo "::error::all-evidence artifact has no results.json."; exit 1; }
        fi
        body_file="$RUNNER_TEMP/evals-comment.md"
        if [ "$COMPARE" = "true" ]; then
          dir=$(mktemp -d)
          if gh run download "$RUN_ID" -R "$EVALS_REPO" \
            -n "comparison-$RUN_ID" -D "$dir"; then
            comparison="$dir/comparison.md"
            if [ -f "$comparison" ]; then
              body="$(cat "$comparison")"
              body="$body"$'\n\n'"[Full summary]($RUN_URL)"
            else
              body="Evals run ended ($conclusion) before producing a comparison."
              body="$body"$'\n\n'"[Full summary]($RUN_URL)"
            fi
          else
            body="Evals run ended ($conclusion) before producing a comparison."
            body="$body"$'\n\n'"[Full summary]($RUN_URL)"
          fi
          printf '%s\n' "$body" > "$body_file"
        elif [ -n "$results" ]; then
          run_json=$(dirname "$results")/run.json
          commit=$(jq -r '.mcp.airbyte.direct_url.vcs_info.commit_id // "unknown"' "$run_json")
          expected=$(jq -r '.expected_trials // empty' "$run_json")
          body=$(jq -r --arg expected "$expected" --arg commit "${commit:0:7}" --arg report_label "$LABEL" '
            (if $expected == "" then length else ($expected | tonumber) end) as $total
            | (map(select(.status == "pass")) | length) as $passed
            | ((group_by(.status) | map(select(.[0].status != "pass")
                 | "\(length) \({fail: "failed", error: "errored"}[.[0].status] // .[0].status)"))
               + (if $total > length then ["\($total - length) missing"] else [] end)) as $other
            | "Cloud MCP evals on `\($commit)` (\($report_label)): **\($passed) / \($total) passed**"
              + (if ($other | length) > 0 then " (\($other | join(", ")))" else "" end)' "$results")
          body="$body · [summary]($RUN_URL)"
        elif [ "$conclusion" = "success" ] && [ "$CHANGED_ONLY" = "true" ]; then
          body="No evals ran: no scenario uses the MCP tools this PR changed. [summary]($RUN_URL)"
        elif [ "$conclusion" = "success" ]; then
          echo "::error::Full evals run succeeded but uploaded no all-evidence artifact."
          exit 1
        else
          body="Evals run ended ($conclusion) before producing results. [summary]($RUN_URL)"
        fi
        if [ "$COMPARE" != "true" ]; then
          printf '> %s\n' "$body" > "$body_file"
        fi
        echo "body-path=$body_file" >> "$GITHUB_OUTPUT"
        cat "$body_file"

    - name: Append results comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.first-comment-action.outputs.comment-id }}
        body-path: ${{ steps.report.outputs.body-path }}

    - name: Append failure comment
      if: failure()
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.first-comment-action.outputs.comment-id }}
        issue-number: ${{ inputs.pr }}
        reactions: confused
        body: |
          > ❌ Cloud MCP evals could not be run or reported. [Check job output.](${{ steps.vars.outputs.run-url }})
