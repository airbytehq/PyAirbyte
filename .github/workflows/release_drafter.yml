name: Release Drafter

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'release-candidate/**'

concurrency:
  # Group by ref so main and release-candidate branches don't serialize.
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft_release:
    name: Draft Release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.10"

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Shallow clone is sufficient since we bypass dynamic versioning
          fetch-depth: 1

      - name: Create draft release (not ready)
        uses: aaronsteers/semantic-pr-release-drafter@v2.4.4
        id: not-ready-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          not-ready: true
          # Pushes to `release-candidate/vX[.Y[.Z]]` draft `vX.Y.Z-rc.N`
          # prereleases; pushes to `main` keep drafting stable releases.
          prerelease-branch-rules: |
            - branch-prefix: release-candidate/
              prerelease-identifier: rc

      - name: Build package
        env:
          VERSION: ${{ steps.not-ready-draft.outputs.tag-name }}
        # Standardize by removing preceding 'v' char:
        run: UV_DYNAMIC_VERSIONING_BYPASS="${VERSION#v}" uv build

      - name: Attach assets and finalize draft
        uses: aaronsteers/semantic-pr-release-drafter@v2.4.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Finalize the exact draft prepared above via a strongly consistent
          # point-read; version/tag/prerelease/SHA are reused from that release.
          prepared-release-id: ${{ steps.not-ready-draft.outputs.id }}
          # Pushes to `release-candidate/vX[.Y[.Z]]` draft `vX.Y.Z-rc.N`
          # prereleases; pushes to `main` keep drafting stable releases.
          prerelease-branch-rules: |
            - branch-prefix: release-candidate/
              prerelease-identifier: rc
          attach-files: |
            dist/*.whl
            dist/*.tar.gz
          categories: |
            # MCP features as separate section
            - title: '❇️ New MCP Features'
              commit-scopes:
                - 'mcp'
              commit-types:
                - 'feat'
              display-order: 100
            # Generic categories
            - title: '🚀 New PyAirbyte Features'
              commit-types:
                - 'feat'
              display-order: 101
            - title: '🐛 Bug Fixes'
              commit-types:
                - 'fix'
              display-order: 102
            - title: '⚙️ Under the Hood'
              commit-types:
                - 'chore'
                - 'ci'
                - 'build'
                - 'refactor'
                - 'test'
                - 'perf'
                - 'docs'
              collapse-after: 3
              display-order: 999
